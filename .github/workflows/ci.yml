name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:ui
      - run: pnpm --filter ui build
      - run: pnpm --filter ui exec playwright install --with-deps chromium
      - run: pnpm --filter ui test:e2e

  # Proves a fresh clone runs with nothing but Node + npm.
  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: npm debug log
        if: failure()
        run: tail -n 120 ~/.npm/_logs/*-debug-0.log
      - run: npm test
      - run: npm run test:ui
      - run: npm run cli -- run fix --auto-approve --no-save

  # The same fresh-clone path on Windows, where new users have hit problems.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run cli -- run fix --auto-approve --no-save
      - run: npx --prefix packages/ui playwright install chromium
      - run: npm run test:e2e --prefix packages/ui

  # The check the default branch's ruleset requires: green only when every job above is.
  test:
    runs-on: ubuntu-latest
    needs: [pnpm, npm, windows]
    if: always()
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.pnpm.result }}" = success
          test "${{ needs.npm.result }}" = success
          test "${{ needs.windows.result }}" = success
